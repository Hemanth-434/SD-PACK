<div class="product">
    <h2 class="reveal-header">
        {{ selectedType === 'primary' ? 'Primary Packaging' : (selectedType === 'secondary' ? 'Secondary Packaging' :
        'Special Packaging') }}
    </h2>

    <div *ngIf="selectedType === 'primary'">
        <div class="product-item" *ngFor="let item of primaryProducts">
            <div class="product-image">
                <img [src]="item.image" alt="Primary Product" />
            </div>
            <div class="product-text">
                <h3>{{ item.title }}</h3>
                <p>{{ item.description }}</p>
                <a *ngIf="item.link" [href]="item.link" target="_blank" class="learn-more">Learn More</a>
            </div>
        </div>
    </div>

    <div *ngIf="selectedType === 'secondary'">
        <div class="product-item" *ngFor="let item of secondaryProducts">
            <div class="product-image">
                <img [src]="item.image" alt="Secondary Product" />
            </div>
            <div class="product-text">
                <h3>{{ item.title }}</h3>
                <p>{{ item.description }}</p>
                <a *ngIf="item.link" [href]="item.link" target="_blank" class="learn-more">Learn More</a>
            </div>
        </div>
    </div>

    <div *ngIf="selectedType === 'special'">
        <div class="product-item" *ngFor="let item of SpeciailPackaging">
            <div class="product-image">
                <img [src]="item.image" alt="Speciail Packaging" />
            </div>
            <div class="product-text">
                <h3>{{ item.title }}</h3>
                <p>{{ item.description }}</p>
                <a *ngIf="item.link" [href]="item.link" target="_blank" class="learn-more">Learn More</a>
            </div>
        </div>
    </div>
</div>
